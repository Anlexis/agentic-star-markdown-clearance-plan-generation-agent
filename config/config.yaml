# Runtime parameters — loaded by the agent registry and passed as Graph(config=...).
# Separate from config/agent.yaml, which is the static manifest.

# Retry budget for the backbone's routing decision.
max_retry: 3
# Request timeout in seconds, honoured by framework service clients.
timeout_s: 30

# Clearance-plan settings. Forwarded to the planning workflow by
# MarkdownPlanGraphNode._parent_config() and republished into inner state by
# DomainWorkflowGraph._extra_initial_state(), where DataEnrichNode and
# DocumentGenerateNode read them.
plan:
  # Deepest discount this deployment will ever recommend, in percent. Every
  # category rule and every caller request is narrowed against it — a request
  # may ask for a tighter ceiling, never a looser one.
  max_discount_pct: 70
  # Number of weeks the schedule covers. 1-12.
  horizon_weeks: 4
  # How strongly a discount is expected to move the remaining stock. 1.0 means
  # a 50% average discount is expected to clear half of what is left; 0 turns
  # the projection off and reports today's sell-through unchanged.
  clearance_uplift_factor: 0.8
  # Per-category ceilings and margin floors. A category absent from this table
  # falls back to the `default` entry.
  margin_rules:
    default:
      max_discount_pct: 50
      margin_floor_pct: 20
    apparel:
      max_discount_pct: 70
      margin_floor_pct: 15
    electronics:
      max_discount_pct: 40
      margin_floor_pct: 25
    food:
      max_discount_pct: 60
      margin_floor_pct: 10
  # Share of each category's clearance stock to push online, in percent. The
  # in-store share is the remainder.
  channel_split:
    default:
      online_pct: 50
    apparel:
      online_pct: 60
    electronics:
      online_pct: 70
    food:
      online_pct: 20
